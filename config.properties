# ---- MyPhotos settings ----

# Port the web app listens on. Open http://localhost:8080 on this computer.
port=8080

# 0.0.0.0 = reachable from your other devices (needed for your phone / Tailscale).
# 127.0.0.1 = this computer only.
bind=0.0.0.0

# REQUIRED: choose a strong password. The server will not start while this is CHANGE_ME.
password=CHANGE_ME

# Storage you allow the library to use, in GB (decimals are fine, e.g. 0.5).
quotaGB=50

# Where photos are stored. On Windows use forward slashes, e.g. D:/MyPhotosData
dataDir=data
