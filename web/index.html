<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>My Photos</title>
<style>
:root{--bg:#fff;--fg:#202124;--muted:#5f6368;--line:#e0e3e7;--accent:#1a73e8;--onaccent:#fff;--tile:#eceff1;--bar:#e8eaed;--danger:#d93025}
@media (prefers-color-scheme:dark){:root{--bg:#171717;--fg:#e8eaed;--muted:#9aa0a6;--line:#2e3033;--accent:#8ab4f8;--onaccent:#0b1b33;--tile:#26282b;--bar:#2e3033;--danger:#f28b82}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login form{width:min(340px,100%);display:grid;gap:12px;text-align:center}
#login h1{margin:0 0 4px;font-size:26px;font-weight:600}
#login input{padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#login input:focus{outline:2px solid var(--accent);outline-offset:-1px}
#loginerr{min-height:1.2em;margin:0;color:var(--danger);font-size:14px}

.btn{padding:9px 16px;border:0;border-radius:999px;background:var(--accent);color:var(--onaccent);font-weight:600}
.btn:hover{filter:brightness(1.08)}
.ghost{padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:transparent}
.ghost:hover{background:var(--tile)}

/* header */
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:20px;font-weight:600;margin-right:auto}
#usage{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.bar{width:140px;height:6px;border-radius:3px;background:var(--bar);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.bar.full i{background:var(--danger)}
@media (max-width:600px){#usage{order:5;flex-basis:100%}.bar{flex:1}}

/* grid */
main{padding:4px 16px 80px}
h2{margin:22px 0 8px;font-size:14px;font-weight:600;color:var(--muted)}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px}
@media (max-width:600px){.row{grid-template-columns:repeat(auto-fill,minmax(105px,1fr))}main{padding:4px 8px 80px}}
.tile{position:relative;aspect-ratio:1;padding:0;border:0;border-radius:4px;overflow:hidden;background:var(--tile)}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .15s}
.tile:hover img{transform:scale(1.03)}
#empty{margin:18vh auto 0;max-width:360px;text-align:center;color:var(--muted)}
#empty b{display:block;margin-bottom:6px;color:var(--fg);font-size:18px}

/* drag overlay + toast */
#drop{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 85%,transparent);border:3px dashed var(--accent);font-size:22px;font-weight:600;pointer-events:none}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:40;min-width:240px;max-width:90vw;padding:10px 16px;border-radius:10px;background:#303134;color:#fff;font-size:14px;box-shadow:0 4px 16px #0006}
#toast .bar{width:100%;margin-top:8px;background:#5f6368}
#toast .bar i{background:#8ab4f8}

/* lightbox */
#lb{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#000}
#lb img{max-width:100vw;max-height:100vh;object-fit:contain;user-select:none}
.lbtop{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:10px 14px;color:#fff;background:linear-gradient(#000a,#0000)}
.lbtop #lbinfo{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.lbtop button,.lbtop a{padding:8px 14px;border:1px solid #fff4;border-radius:999px;background:#0006;color:#fff;font-size:14px;text-decoration:none}
.lbtop button:hover,.lbtop a:hover{background:#fff2}
#lbdel{color:#f28b82!important}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:64px;border:0;border-radius:8px;background:#0005;color:#fff;font-size:34px}
.nav:hover{background:#fff3}
#prev{left:8px}#next{right:8px}
@media (max-width:600px){.nav{display:none}}
</style>
</head>
<body>

<section id="login" hidden>
  <form id="loginform">
    <h1>My Photos</h1>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
    <button class="btn" type="submit">Sign in</button>
    <p id="loginerr"></p>
  </form>
</section>

<div id="app" hidden>
  <header>
    <h1>Photos</h1>
    <div id="usage"><div class="bar" id="usagebar"><i></i></div><span id="usagetext"></span></div>
    <button class="btn" id="uploadbtn">Upload</button>
    <button class="ghost" id="logout">Sign out</button>
    <input id="picker" type="file" accept="image/*" multiple hidden>
  </header>
  <main>
    <div id="empty" hidden><b>No photos yet</b>Drag photos anywhere onto this page, or press Upload.</div>
    <div id="grid"></div>
  </main>
</div>

<div id="drop" hidden>Drop photos to upload</div>
<div id="toast" hidden><span id="toasttext"></span><div class="bar" id="toastbar" hidden><i></i></div></div>

<div id="lb" hidden>
  <div class="lbtop">
    <button id="lbclose">Close</button>
    <div id="lbinfo"></div>
    <a id="lbdl" href="#">Download</a>
    <button id="lbdel">Delete</button>
  </div>
  <button class="nav" id="prev" aria-label="Previous">&#8249;</button>
  <img id="lbimg" alt="">
  <button class="nav" id="next" aria-label="Next">&#8250;</button>
</div>

<script>
const $ = s => document.querySelector(s);
let photos = [], usage = {used: 0, limit: 1}, cur = -1;

/* Photo times are "floating": the camera's wall-clock time stored as UTC, so we read them with UTC getters. */
const dayKey   = t => new Date(t).toISOString().slice(0, 10);
const dayLabel = t => new Date(t).toLocaleDateString(undefined, {timeZone: 'UTC', weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'});
const fullDate = t => new Date(t).toLocaleString(undefined, {timeZone: 'UTC', dateStyle: 'medium', timeStyle: 'short'});
function fmt(n) {
  const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (n >= 100 || i === 0 ? n.toFixed(0) : n.toFixed(1)) + ' ' + u[i];
}

/* ---------- session ---------- */
function showLogin() { $('#app').hidden = true; $('#login').hidden = false; $('#pw').focus(); }
function showApp()   { $('#login').hidden = true; $('#app').hidden = false; }

$('#loginform').addEventListener('submit', async e => {
  e.preventDefault();
  $('#loginerr').textContent = '';
  const r = await fetch('/api/login', {method: 'POST', body: new URLSearchParams({password: $('#pw').value})});
  if (r.ok) { $('#pw').value = ''; load(); }
  else $('#loginerr').textContent = r.status === 429 ? 'Too many attempts. Try again in a few minutes.' : 'Wrong password.';
});
$('#logout').addEventListener('click', async () => { await fetch('/api/logout', {method: 'POST'}); photos = []; showLogin(); });

async function load() {
  const r = await fetch('/api/library');
  if (r.status === 401) { showLogin(); return; }
  const d = await r.json();
  photos = d.photos; usage = {used: d.used, limit: d.limit};
  showApp(); render();
}

/* ---------- grid ---------- */
function render() {
  const grid = $('#grid');
  grid.textContent = '';
  $('#empty').hidden = photos.length > 0;
  let lastKey = null, row = null;
  photos.forEach((p, i) => {
    const key = dayKey(p.taken);
    if (key !== lastKey) {
      const h = document.createElement('h2'); h.textContent = dayLabel(p.taken);
      row = document.createElement('div'); row.className = 'row';
      grid.append(h, row); lastKey = key;
    }
    const b = document.createElement('button'); b.className = 'tile'; b.dataset.i = i; b.title = p.name;
    const img = new Image(); img.alt = ''; img.loading = 'lazy'; img.decoding = 'async'; img.src = '/api/thumb/' + p.id;
    b.append(img); row.append(b);
  });
  const pct = Math.min(100, usage.used / usage.limit * 100);
  $('#usagebar i').style.width = pct + '%';
  $('#usagebar').classList.toggle('full', pct > 95);
  $('#usagetext').textContent = fmt(usage.used) + ' of ' + fmt(usage.limit) + ' used';
}
$('#grid').addEventListener('click', e => { const b = e.target.closest('.tile'); if (b) openLb(+b.dataset.i); });

/* ---------- lightbox ---------- */
function openLb(i) {
  if (i < 0 || i >= photos.length) return;
  cur = i;
  const p = photos[i];
  $('#lbimg').src = '/api/photo/' + p.id;
  $('#lbinfo').textContent = p.name + '  \u00b7  ' + fullDate(p.taken) + '  \u00b7  ' + fmt(p.size);
  $('#lbdl').href = '/api/photo/' + p.id + '?download=1';
  $('#lb').hidden = false;
  document.body.style.overflow = 'hidden';
  for (const j of [i - 1, i + 1]) if (photos[j]) new Image().src = '/api/photo/' + photos[j].id; // preload neighbours
}
function closeLb() { $('#lb').hidden = true; $('#lbimg').src = ''; cur = -1; document.body.style.overflow = ''; }
$('#lbclose').addEventListener('click', closeLb);
$('#prev').addEventListener('click', () => openLb(cur - 1));
$('#next').addEventListener('click', () => openLb(cur + 1));
$('#lb').addEventListener('click', e => { if (e.target.id === 'lb') closeLb(); });
document.addEventListener('keydown', e => {
  if ($('#lb').hidden) return;
  if (e.key === 'Escape') closeLb();
  else if (e.key === 'ArrowLeft') openLb(cur - 1);
  else if (e.key === 'ArrowRight') openLb(cur + 1);
  else if (e.key === 'Delete') $('#lbdel').click();
});
let touchX = null;
$('#lbimg').addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, {passive: true});
$('#lbimg').addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (dx > 60) openLb(cur - 1); else if (dx < -60) openLb(cur + 1);
});
$('#lbdel').addEventListener('click', async () => {
  const p = photos[cur]; if (!p) return;
  if (!confirm('Delete "' + p.name + '" permanently?')) return;
  const r = await fetch('/api/photo/' + p.id, {method: 'DELETE'});
  if (!r.ok) { toast('Could not delete that photo.'); return; }
  const at = cur;
  photos.splice(at, 1); usage.used = Math.max(0, usage.used - p.size);
  render();
  if (photos.length === 0) closeLb(); else openLb(Math.min(at, photos.length - 1));
  load(); // refresh exact usage numbers
});

/* ---------- upload ---------- */
let toastTimer;
function toast(msg, progress) {
  clearTimeout(toastTimer);
  $('#toast').hidden = false; $('#toasttext').textContent = msg;
  $('#toastbar').hidden = progress === undefined;
  if (progress !== undefined) $('#toastbar i').style.width = Math.round(progress * 100) + '%';
  if (progress === undefined) toastTimer = setTimeout(() => { $('#toast').hidden = true; }, 5000);
}

function xhrUpload(f, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    const taken = f.lastModified - new Date(f.lastModified).getTimezoneOffset() * 60000; // wall-clock as "UTC"
    x.open('POST', '/api/upload?name=' + encodeURIComponent(f.name) + '&taken=' + taken);
    x.setRequestHeader('Content-Type', 'application/octet-stream');
    x.upload.onprogress = e => onProgress(e.loaded);
    x.onload = () => x.status === 200 ? resolve(JSON.parse(x.responseText)) : reject(new Error(String(x.status)));
    x.onerror = () => reject(new Error('network'));
    x.send(f);
  });
}

let uploading = false;
async function uploadFiles(list) {
  if (uploading) { toast('An upload is already running.'); return; }
  const files = [...list].filter(f => /\.(jpe?g|png|gif|webp|bmp)$/i.test(f.name));
  if (!files.length) { toast('No supported images. Use JPG, PNG, GIF, WebP or BMP.'); return; }
  uploading = true;
  const total = files.reduce((a, f) => a + f.size, 0);
  let done = 0, ok = 0, dup = 0, tooBig = 0, failed = 0;
  for (const [n, f] of files.entries()) {
    if (usage.used + f.size > usage.limit) { tooBig++; done += f.size; continue; }
    try {
      toast('Uploading ' + (n + 1) + ' of ' + files.length + '\u2026', done / total);
      const r = await xhrUpload(f, loaded => toast('Uploading ' + (n + 1) + ' of ' + files.length + '\u2026', (done + loaded) / total));
      if (r.duplicate) dup++; else { ok++; usage.used += f.size; }
    } catch (err) { failed++; }
    done += f.size;
  }
  uploading = false;
  await load();
  const parts = [ok + ' uploaded'];
  if (dup) parts.push(dup + ' already in library');
  if (tooBig) parts.push(tooBig + ' skipped: storage full');
  if (failed) parts.push(failed + ' failed');
  toast(parts.join(', '));
}

$('#uploadbtn').addEventListener('click', () => $('#picker').click());
$('#picker').addEventListener('change', e => { uploadFiles(e.target.files); e.target.value = ''; });

let dragDepth = 0;
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
window.addEventListener('dragenter', e => { if (hasFiles(e)) { dragDepth++; $('#drop').hidden = false; } });
window.addEventListener('dragleave', e => { if (hasFiles(e) && --dragDepth <= 0) { dragDepth = 0; $('#drop').hidden = true; } });
window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; $('#drop').hidden = true;
  if (!$('#app').hidden) uploadFiles(e.dataTransfer.files);
});

load();
</script>
</body>
</html>
